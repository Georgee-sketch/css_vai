<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="Login">
        <fieldset>
            <legend>Login</legend>
        <input placeholder="First Name">
        <input placeholder="Last Name"><br>
        <input id="email" name="email" type="email" placeholder="Enter Your Email"><br>
        <input id="email-" name="email-" type="email" placeholder="Re-Enter Your Email"><br>
        <input id="password" name="password" type="password" placeholder="Enter Your Password"><br>
    </form>
    
    <form>
        <input id="date" type="date"><br>
        <input id="radio" type="radio" name="Male"><label>Male</label>
        <input id="radio" type="radio" name="Female"><label>Female</label>
    </form>

</body>
</html>
