<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <div>
      <label for="firstname">სახელი</label>
      <input type="text" name="firstname" required>
        </div>

        <div>
            <label for="lastname">გვარი</label>
            <input type="text" name="lastname" required>
        </div>

            <div>
                <label for="mail">ელ.ფოსტა</label>
                <input type="email" name="mail" placeholder="example@gmail.com" title="please enter a valid email"
                pattern="[a-zA-z0-9._%\-]+@[a-zA-Z0-9.\-]+\.[a-zA-Z]{2,}">

            </div>


            <div>
                <label>ტელ:</label>
               <select id="phone" name="phone">
                <option value="georgia" selected>+995</option>
               </select>
               
               
                <input type="tel" pattern="[0-9]{3}-[0-9]{2}-[0-9]{2}-[0-9]{2}-">
            </div>
            <button type="submit">რეგისტრაცია</button>

    </form>
</body>
</html>
